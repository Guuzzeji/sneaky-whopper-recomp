# Sneak King settings. Each KEY=value line sets the RECOMP_KEY switch
# (docs/BUILDING.md lists them all); an environment variable of the same
# name wins over this file. Leave a value empty to use the default.
# Comments go on their own line. Restart the game after a change.

# Graphics back end: d3d11 (default), vulkan or gl.
GFX=d3d11

# Resolution: 1 to 8 times the Xbox's 640x480 (2 = 1280x960).
SCALE=2

# 1 = 16:9, 0 = the original 4:3.
WIDESCREEN=1

# HD textures from the Xbox 360 half of the disc: the folder they are in,
# or 0 for the original Xbox textures.
HD_TEX=game/hd

# Camera turn per mouse count, in degrees (default 0.08).
MOUSE_DEG=0.08

# Master volume, 0 to 100 percent.
VOLUME=100

# 1 = wait for the screen's refresh (no tearing), 0 = off.
VSYNC=0

# The log goes to logs\sneakking.log (attach it to bug reports);
# 1 = show it in a console window instead.
CONSOLE=0

# The key bindings are in mkb.ini.
