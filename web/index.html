<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneak King</title>
<style>
  :root { --bg: #111; --fg: #ddd; --dim: #888; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { background: #000; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; outline: none; }
  #bar { padding: 6px 12px; color: var(--dim); display: flex; gap: 16px; flex-wrap: wrap; }
  #cheats { padding: 0 12px 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--dim); }
  #cheats button { font: inherit; background: #222; color: var(--fg); border: 1px solid #444;
                   border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #cheats button:hover { background: #333; }
  #log { height: 9em; overflow: auto; margin: 0; padding: 6px 12px; background: #000;
         color: #9c9; font: 11px/1.3 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <!-- The game renders into #canvas from a worker; frames come back as
         ImageBitmaps and are shown on #screen (gl_hle.c swap_window). -->
    <canvas id="canvas" width="1280" height="960" hidden></canvas>
    <canvas id="screen" width="1280" height="960" tabindex="0"></canvas>
  </div>
  <div id="bar">
    <span id="status">Loading...</span>
    <span>Enter: START · Z: A · X: B · WASD: move · arrows: d-pad · click the picture for the mouse camera, Esc to release</span>
  </div>
  <!-- Cheats, as in the native F1 overlay. Each one runs on the game thread
       at the next frame (web_host.c web_cheat). Warp works only in play. -->
  <div id="cheats">
    Cheats:
    <button data-c="0">Unlock levels</button>
    <button data-c="1">Unlock levels + missions</button>
    Warp (in play):
    <button data-c="2">Sawmill</button>
    <button data-c="3">Suburbia</button>
    <button data-c="4">Construction</button>
    <button data-c="5">Urban</button>
  </div>
  <pre id="log"></pre>
</div>
<script>
  // Query-string switches become the program's environment, as RECOMP_* do
  // natively: ?RECOMP_SCALE=1&RECOMP_D3D9_STATS=1
  const params = new URLSearchParams(location.search);
  const logEl = document.getElementById('log');
  const lines = [];
  function log(t) {
    lines.push(t);
    if (lines.length > 400) lines.splice(0, lines.length - 400);
    logEl.textContent = lines.join('\n');
    logEl.scrollTop = logEl.scrollHeight;
  }
  if (!crossOriginIsolated)
    log('Not cross-origin isolated: serve this folder with tools/serve.py (COOP/COEP).');
  const screen = document.getElementById('screen').getContext('bitmaprenderer');
  new BroadcastChannel('sk-frames').onmessage = (e) => screen.transferFromImageBitmap(e.data);
  var Module = {
    canvas: document.getElementById('canvas'),
    print: (t) => { console.log(t); log(t); },
    printErr: (t) => { console.warn(t); log(t); },
    preRun: [() => { for (const [k, v] of params) ENV[k] = v; }],
    onRuntimeInitialized: () => { document.getElementById('status').textContent = 'Running'; },
  };
</script>
<script>
  for (const b of document.querySelectorAll('#cheats button'))
    b.onclick = () => {
      if (!Module._web_cheat) return;
      Module._web_cheat(+b.dataset.c);
      log('[cheat] ' + b.textContent);
      b.blur();                    // keys keep going to the game
    };
</script>
<script src="sneakking_recomp.js"></script>
</body>
</html>
