# Keyboard and mouse for Sneak King (the toolkit's src/input/mkb_input.h).
# bind.<PAD>=<INPUT>,<INPUT>  -- no spaces in a value.
# F9 releases and recaptures the mouse.
#
# The game's own layout (Help & Options > Controls): left stick or d-pad
# move, left stick click first person, right stick camera, right stick
# click zoom, RT run, A surprise/flourish/accept, B cancel, Y hide/action,
# START or BACK pause.

# The mouse turns the camera (right stick).
sens=1.0
full=8
invert_y=0

# Gameplay
bind.MOVE_UP=W
bind.MOVE_DOWN=S
bind.MOVE_LEFT=A
bind.MOVE_RIGHT=D
bind.RT=SHIFT
bind.A=MOUSE1,SPACE,ENTER
bind.Y=E,MOUSE3
bind.B=MOUSE2,Q,BACKSPACE,MOUSE4
bind.LS=F
bind.RS=WHEELUP,WHEELDOWN,Z
bind.X=R
bind.LT=CTRL

# Menus: the arrows or WASD move, Enter or left click accepts,
# right click or Backspace goes back, Escape pauses.
bind.DPAD_UP=UP
bind.DPAD_DOWN=DOWN
bind.DPAD_LEFT=LEFT
bind.DPAD_RIGHT=RIGHT
bind.START=ESCAPE
bind.BACK=TAB
bind.WHITE=1
bind.BLACK=2
