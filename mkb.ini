# Keyboard and mouse for Sneak King (the toolkit's src/input/mkb_input.h).
# bind.<PAD>=<INPUT>,<INPUT>  -- no spaces in a value.
# The mouse is locked and hidden while playing, free in menus and on the
# title and loading screens. F9 releases it in play; a click takes it back.
#
# The game's own layout (Help & Options > Controls): left stick or d-pad
# move, left stick click first person, right stick camera, right stick
# click zoom, RT run, A surprise/flourish/accept, B cancel, Y hide/action,
# START or BACK pause.

# The mouse turns the camera directly (recomp_manual.c, RECOMP_MOUSE_DEG
# degrees per count, default 0.08): right looks right, up looks up. The
# game's Invert Camera option still applies. In menus the pointer selects.
# sens/full/invert_y only matter if the mouse drives the right stick.
sens=1.0
full=8
invert_y=0

# Gameplay
bind.MOVE_UP=W
bind.MOVE_DOWN=S
bind.MOVE_LEFT=A
bind.MOVE_RIGHT=D
bind.RT=SHIFT
bind.A=MOUSE1,SPACE,ENTER
bind.Y=E,MOUSE3
bind.B=MOUSE2,Q,BACKSPACE,MOUSE4
bind.LS=F
bind.RS=WHEELUP,WHEELDOWN,Z
bind.X=R
bind.LT=CTRL

# Menus: the arrows or WASD move, Enter or left click accepts,
# right click or Backspace goes back, Escape or P pauses (START).
bind.DPAD_UP=UP
bind.DPAD_DOWN=DOWN
bind.DPAD_LEFT=LEFT
bind.DPAD_RIGHT=RIGHT
bind.START=ESCAPE,P
bind.BACK=TAB
bind.WHITE=1
bind.BLACK=2
